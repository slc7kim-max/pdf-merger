<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 합치기</title>
<meta name="description" content="여러 PDF 파일을 내 브라우저 안에서 한 파일로 합쳐요">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f2f4f6;
    --text: #191f28;
    --text-sub: #6b7684;
    --line: #e5e8eb;
    --blue: #3182f6;
    --red: #f04452;
    --green: #03b26c;
    --radius-card: 16px;
    --radius-big: 12px;
    --radius-small: 8px;
    --motion: 150ms;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --motion: 0ms; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .page {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  h1 { margin: 0; font-size: 1.625rem; font-weight: 700; line-height: 1.5; }
  h2 { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.5; }
  p { margin: 0; }
  .lead { color: var(--text-sub); margin-top: 4px; }
  .small { font-size: 0.8125rem; line-height: 1.5; color: var(--text-sub); }

  /* 버튼 */
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    min-width: 44px;
    padding: 8px 16px;
    border-radius: var(--radius-small);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    transition: background var(--motion);
  }
  .btn:hover { background: #e5e8eb; }
  .btn-big { min-height: 52px; border-radius: var(--radius-big); padding: 12px 20px; }
  .btn-primary {
    background: var(--blue);
    color: #ffffff;
    font-size: 1.125rem;
    font-weight: 700;
  }
  .btn-primary:hover { background: #1b64da; }
  .btn-full { width: 100%; }
  .btn[aria-busy="true"] { cursor: progress; }

  /* 빈 화면 + 끌어다 놓는 곳 */
  .drop {
    border: 2px dashed var(--line);
    border-radius: var(--radius-card);
    background: var(--bg);
    padding: 40px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    transition: border-color var(--motion), background var(--motion);
  }
  .drop.is-over { border-color: var(--blue); background: var(--bg-soft); }
  .drop .icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: var(--bg-soft);
    display: grid; place-items: center;
    margin-bottom: 4px;
  }
  .drop .btn { margin-top: 12px; }
  .drop-compact { padding: 16px; flex-direction: row; justify-content: space-between; text-align: left; gap: 12px; flex-wrap: wrap; }
  .drop-compact .btn { margin-top: 0; }

  /* 목록 */
  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-big);
    background: var(--bg);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .item.is-error { border-color: var(--red); }
  .item.is-ghost { opacity: 0.4; }
  .item.is-chosen { background: var(--bg-soft); }
  .order {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg-soft);
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 1rem;
  }
  .info { min-width: 0; }
  .name { font-weight: 600; word-break: break-all; }
  .meta { font-size: 0.8125rem; color: var(--text-sub); }
  .err-label { color: var(--text); font-weight: 700; }
  .reason { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-start; font-size: 0.8125rem; color: var(--text); padding: 8px 12px; border-radius: var(--radius-small); background: var(--bg-soft); }
  .reason svg { flex: none; margin-top: 2px; }
  .actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: var(--radius-small);
    background: var(--bg-soft);
    display: grid; place-items: center;
    transition: background var(--motion);
  }
  .icon-btn:hover { background: #e5e8eb; }
  .icon-btn[aria-disabled="true"] { opacity: 0.35; cursor: default; }

  /* 합치기 영역 */
  .merge { display: flex; flex-direction: column; gap: 8px; }
  .status { display: flex; gap: 8px; align-items: flex-start; min-height: 0; }
  .status:empty { display: none; }
  .status svg { flex: none; margin-top: 2px; }
  .status .row { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .note { display: flex; gap: 8px; align-items: flex-start; }
  .note svg { flex: none; margin-top: 3px; }

  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (min-width: 720px) {
    .page { padding-top: 56px; }
    .card { padding: 24px; }
    .merge { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .merge .btn-full { width: auto; min-width: 240px; order: 2; }
    .merge .status { order: 1; flex: 1 1 320px; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>PDF 합치기</h1>
    <p class="lead">여러 PDF 파일을 한 파일로 합쳐요</p>
  </header>

  <!-- 빈 화면 -->
  <section id="empty" class="drop" aria-labelledby="emptyTitle">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="#6b7684" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M14 3v5h5" stroke="#6b7684" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12.5 11v6M9.5 14h6" stroke="#3182f6" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <h2 id="emptyTitle">합칠 PDF 파일을 넣어 주세요</h2>
    <p class="lead">파일을 여기로 끌어다 놓아도 돼요</p>
    <button type="button" class="btn btn-big btn-primary" data-pick>PDF 파일 고르기</button>
  </section>

  <!-- 파일 목록 -->
  <section id="filled" class="card hidden" aria-labelledby="listTitle">
    <div>
      <h2 id="listTitle">합칠 순서</h2>
      <p class="small">끌어서 순서를 바꿀 수 있어요. 위로, 아래로 버튼도 쓸 수 있어요.</p>
    </div>
    <ol id="list" class="list"></ol>
    <div id="dropMore" class="drop drop-compact">
      <p class="small">파일을 여기로 끌어다 놓아도 돼요</p>
      <button type="button" class="btn" data-pick>파일 더 넣기</button>
    </div>
  </section>

  <section id="mergeBox" class="merge hidden" aria-label="합치기">
    <button type="button" id="mergeBtn" class="btn btn-big btn-primary btn-full">합치기</button>
    <div id="status" class="status" aria-live="polite" role="status"></div>
  </section>

  <p class="note small">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#6b7684" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#6b7684" stroke-width="2"/></svg>
    <span>파일은 이 기기 안에서만 처리해요. 어디에도 보내지 않아요.</span>
  </p>

  <input id="fileInput" class="sr-only" type="file" accept="application/pdf,.pdf" multiple tabindex="-1" aria-hidden="true">
  <div id="announcer" class="sr-only" aria-live="polite"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
(function () {
  'use strict';

  var ICON_UP = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 15l6-6 6 6" stroke="#191f28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_DOWN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="#191f28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_REMOVE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="#191f28" stroke-width="2" stroke-linecap="round"/></svg>';
  var ICON_ALERT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#f04452"/><path d="M12 7v6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.3" fill="#fff"/></svg>';
  var ICON_DONE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#03b26c"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var items = [];
  var nextId = 1;
  var merging = false;

  var $ = function (id) { return document.getElementById(id); };
  var emptyEl = $('empty'), filledEl = $('filled'), mergeBox = $('mergeBox');
  var listEl = $('list'), statusEl = $('status'), mergeBtn = $('mergeBtn');
  var fileInput = $('fileInput'), announcer = $('announcer');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function announce(msg) {
    announcer.textContent = '';
    setTimeout(function () { announcer.textContent = msg; }, 50);
  }

  function setStatus(kind, lines, action) {
    if (!kind) { statusEl.innerHTML = ''; return; }
    var icon = kind === 'error' ? ICON_ALERT : kind === 'done' ? ICON_DONE : '';
    var html = icon + '<div class="row">' + lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('');
    if (action) html += '<button type="button" class="btn" id="statusAction">' + esc(action.label) + '</button>';
    html += '</div>';
    statusEl.innerHTML = html;
    if (action) $('statusAction').addEventListener('click', action.run);
  }

  /* ---------- 파일 읽기 ---------- */
  function isPdf(file) {
    return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  }

  function addFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    setStatus(null);
    files.forEach(function (file) {
      var item = { id: nextId++, name: file.name, state: 'loading', pages: 0, doc: null, reason: '' };
      items.push(item);
      if (!isPdf(file)) {
        item.state = 'error';
        item.reason = 'PDF 파일이 아니에요. 이름이 .pdf 로 끝나는 파일을 골라 주세요.';
        announce(file.name + ' 파일은 열 수 없어요');
        return;
      }
      readFile(file).then(function (buf) {
        if (!window.PDFLib) throw new Error('nolib');
        return PDFLib.PDFDocument.load(buf, { updateMetadata: false });
      }).then(function (doc) {
        var n = doc.getPageCount();
        if (!n) throw new Error('nopage');
        item.doc = doc; item.pages = n; item.state = 'ok';
        render();
      }).catch(function (err) {
        item.state = 'error';
        var msg = String((err && err.message) || '');
        if (msg === 'nolib') {
          item.reason = '합치기 도구를 불러오지 못했어요. 인터넷에 연결한 뒤 화면을 다시 열어 주세요.';
        } else if (/encrypt/i.test(msg)) {
          item.reason = '암호가 걸려 있어요. 암호를 푼 파일로 다시 넣어 주세요.';
        } else {
          item.reason = '파일이 망가져 있어요. 다른 파일로 다시 넣어 주세요.';
        }
        announce(item.name + ' 파일은 열 수 없어요');
        render();
      });
    });
    render();
  }

  function readFile(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      r.readAsArrayBuffer(file);
    });
  }

  /* ---------- 목록 그리기 ---------- */
  function render(focus) {
    var has = items.length > 0;
    emptyEl.classList.toggle('hidden', has);
    filledEl.classList.toggle('hidden', !has);
    mergeBox.classList.toggle('hidden', !has);

    listEl.innerHTML = items.map(function (it, i) {
      var name = esc(it.name);
      var first = i === 0, last = i === items.length - 1;
      var body, extra = '';
      if (it.state === 'loading') {
        body = '<p class="meta">쪽수를 세고 있어요</p>';
      } else if (it.state === 'ok') {
        body = '<p class="meta">' + it.pages + '쪽</p>';
      } else {
        body = '<p class="meta"><strong class="err-label">이 파일은 열 수 없어요</strong></p>';
        extra = '<p class="reason">' + ICON_ALERT + '<span>' + esc(it.reason) + '</span></p>';
      }
      return '<li class="item' + (it.state === 'error' ? ' is-error' : '') + '" data-id="' + it.id + '">' +
        '<span class="order" aria-hidden="true">' + (i + 1) + '</span>' +
        '<div class="info"><p class="name"><span class="sr-only">' + (i + 1) + '번째, </span>' + name + '</p>' + body + '</div>' +
        '<div class="actions">' +
          '<button type="button" class="icon-btn" data-act="up" aria-label="' + name + ' 위로 옮기기"' + (first ? ' aria-disabled="true"' : '') + '>' + ICON_UP + '</button>' +
          '<button type="button" class="icon-btn" data-act="down" aria-label="' + name + ' 아래로 옮기기"' + (last ? ' aria-disabled="true"' : '') + '>' + ICON_DOWN + '</button>' +
          '<button type="button" class="icon-btn" data-act="remove" aria-label="' + name + ' 목록에서 빼기">' + ICON_REMOVE + '</button>' +
        '</div>' + extra + '</li>';
    }).join('');

    if (focus) {
      var target = listEl.querySelector('[data-id="' + focus.id + '"] [data-act="' + focus.act + '"]');
      if (target) target.focus();
    }
  }

  function indexOfId(id) {
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return i;
    return -1;
  }

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var id = Number(btn.closest('.item').getAttribute('data-id'));
    var i = indexOfId(id);
    var act = btn.getAttribute('data-act');
    if (i < 0) return;
    setStatus(null);

    if (act === 'remove') {
      var removed = items.splice(i, 1)[0];
      render();
      announce(removed.name + ' 파일을 뺐어요');
      var next = items[i] || items[i - 1];
      if (next) {
        var nb = listEl.querySelector('[data-id="' + next.id + '"] [data-act="remove"]');
        if (nb) nb.focus();
      } else {
        emptyEl.querySelector('[data-pick]').focus();
      }
      return;
    }
    var to = act === 'up' ? i - 1 : i + 1;
    if (to < 0 || to >= items.length) return;
    var moved = items.splice(i, 1)[0];
    items.splice(to, 0, moved);
    render({ id: id, act: act });
    announce(moved.name + ' 파일을 ' + (to + 1) + '번째로 옮겼어요');
  });

  /* ---------- 끌어서 순서 바꾸기 ---------- */
  if (window.Sortable) {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    Sortable.create(listEl, {
      animation: reduce ? 0 : 150,
      delay: 150,
      delayOnTouchOnly: true,
      forceFallback: true,
      fallbackTolerance: 4,
      filter: 'button',
      preventOnFilter: false,
      ghostClass: 'is-ghost',
      chosenClass: 'is-chosen',
      onEnd: function (evt) {
        if (evt.oldIndex === evt.newIndex) return;
        var moved = items.splice(evt.oldIndex, 1)[0];
        items.splice(evt.newIndex, 0, moved);
        render();
        setStatus(null);
        announce(moved.name + ' 파일을 ' + (evt.newIndex + 1) + '번째로 옮겼어요');
      }
    });
  }

  /* ---------- 파일 고르기, 끌어다 놓기 ---------- */
  document.querySelectorAll('[data-pick]').forEach(function (b) {
    b.addEventListener('click', function () { fileInput.click(); });
  });
  fileInput.addEventListener('change', function () {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  function hasFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    return t && Array.prototype.indexOf.call(t, 'Files') !== -1;
  }
  [emptyEl, $('dropMore')].forEach(function (zone) {
    zone.addEventListener('dragover', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      zone.classList.add('is-over');
    });
    zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
    zone.addEventListener('drop', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      zone.classList.remove('is-over');
      addFiles(e.dataTransfer.files);
    });
  });
  // 다른 곳에 떨어뜨려도 브라우저가 파일을 열어 버리지 않게 해요
  window.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    addFiles(e.dataTransfer.files);
  });

  /* ---------- 합치기 ---------- */
  mergeBtn.addEventListener('click', function () {
    if (merging) return;
    if (!window.PDFLib) {
      setStatus('error', ['합치기 도구를 불러오지 못했어요.', '인터넷에 연결한 뒤 화면을 다시 열어 주세요.'],
        { label: '화면 다시 열기', run: function () { location.reload(); } });
      return;
    }
    var loading = items.filter(function (it) { return it.state === 'loading'; });
    if (loading.length) {
      setStatus('info', ['아직 파일을 읽고 있어요.', '잠시 뒤에 다시 눌러 주세요.']);
      return;
    }
    var ok = items.filter(function (it) { return it.state === 'ok'; });
    var bad = items.length - ok.length;
    if (ok.length < 2) {
      var lines = ['합칠 수 있는 파일이 2개 이상 있어야 해요.'];
      if (bad) lines.push('열 수 없는 파일은 목록에서 빼 주세요.');
      setStatus('error', lines, { label: '파일 더 넣기', run: function () { fileInput.click(); } });
      return;
    }

    merging = true;
    mergeBtn.setAttribute('aria-busy', 'true');
    mergeBtn.textContent = '합치고 있어요';
    setStatus('info', ['파일을 합치고 있어요.']);

    (async function () {
      var out = await PDFLib.PDFDocument.create();
      var total = 0;
      for (var k = 0; k < ok.length; k++) {
        var src = ok[k].doc;
        var pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(function (p) { out.addPage(p); });
        total += pages.length;
      }
      var bytes = await out.save();
      download(bytes, '합친문서.pdf');
      return total;
    })().then(function (total) {
      var lines = ['다 합쳤어요. 모두 ' + total + '쪽이에요.', '합친문서.pdf 파일을 내려받았어요.'];
      if (bad) lines.push('열 수 없는 파일 ' + bad + '개는 빼고 합쳤어요.');
      setStatus('done', lines);
    }).catch(function () {
      setStatus('error', ['파일을 합치지 못했어요.', '목록에서 문제가 되는 파일을 빼고 다시 눌러 주세요.']);
    }).then(function () {
      merging = false;
      mergeBtn.removeAttribute('aria-busy');
      mergeBtn.textContent = '합치기';
    });
  });

  function download(bytes, filename) {
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  render();
})();
</script>
</body>
</html>
